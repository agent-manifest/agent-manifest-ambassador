<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Manifest Ambassador v0.1</title>
<meta name="description" content="A guided interface for generating Agent Manifest v1.0 declarations.">
<meta name="theme-color" content="#14130f">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://agent-manifest.github.io/agent-manifest-ambassador/">

<link rel="icon" type="image/x-icon" href="/agent-manifest-ambassador/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/agent-manifest-ambassador/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/agent-manifest-ambassador/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Agent Manifest">
<meta property="og:title" content="Agent Manifest Ambassador — v1.0 manifest generator">
<meta property="og:description" content="A guided interface for generating Agent Manifest v1.0 declarations.">
<meta property="og:url" content="https://agent-manifest.github.io/agent-manifest-ambassador/">
<meta property="og:image" content="https://agent-manifest.github.io/agent-manifest-ambassador/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Agent Manifest Ambassador social preview card.">
<meta property="og:locale" content="en_US">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Agent Manifest Ambassador — v1.0 manifest generator">
<meta name="twitter:description" content="A guided interface for generating Agent Manifest v1.0 declarations.">
<meta name="twitter:image" content="https://agent-manifest.github.io/agent-manifest-ambassador/og-image.png">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">

  <header class="header">
    <div class="logo">
      <div class="logo-mark"></div>
      <div>
        <div class="logo-title">Ambassador</div>
        <div class="logo-sub">Agent Manifest Generator &middot; v0.1</div>
      </div>
    </div>
    <div class="header-right">
      <div class="status-badge">ONLINE</div>
      <div class="doi-tag">agent-manifest-spec.org</div>
    </div>
  </header>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <div class="input-label" id="inputLabel">Your response</div>
    <div class="input-row">
      <textarea class="input-field" id="inputField" placeholder="Type here and press Enter..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0a0c0f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div>
<!-- The Agent Manifest v1.0 schema and validator, built from the published
     packages by build.mjs and served from this repository. No CDN: the page
     depends on no third party being up. It must load before app.js, which
     reads every rule it enforces out of the schema. -->
<script src="vendor/agent-manifest-v1.0.js"></script>
<script src="app.js"></script>
</body>
</html>
